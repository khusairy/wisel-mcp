services:
  wisel-mcp:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3004
      WISEL_API_URL: ${WISEL_API_URL}
      WISEL_API_TOKEN: ${WISEL_API_TOKEN}
      WISEL_MEDIA_DIR: /media
      WISEL_MEDIA_PUBLIC_URL: ${WISEL_MEDIA_PUBLIC_URL:-https://api.wisel.my/media}
      WORKOS_AUTHKIT_DOMAIN: ${WORKOS_AUTHKIT_DOMAIN:?Set WORKOS_AUTHKIT_DOMAIN in /opt/apps/wisel-mcp/.env}
      WISEL_MCP_RESOURCE_URL: ${WISEL_MCP_RESOURCE_URL:-https://api.wisel.my/mcp}
    volumes:
      - /opt/apps/wisel/media:/media
